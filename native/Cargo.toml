[package]
name = "slate_core"
version = "1.0.1"
edition = "2021"
description = "SLATE Core Engine - High-performance spatial calculations and task processing"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "slate_core"

[dependencies]
# Flutter Rust Bridge for FFI
flutter_rust_bridge = "2"

# High-performance date handling
chrono = { version = "0.4", features = ["serde"] }

# Serialization for data transfer
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parallel processing for bulk operations
rayon = "1.8"

# Phase 3: Offline Engine
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
ureq = { version = "2.9", features = ["json"] }
uuid = { version = "1.8", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
